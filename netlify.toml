[build]
  command       = "npm run build"
  publish       = "dist"

[build.environment]
  NODE_VERSION  = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Bundle the (uncommitted) subcontractor data with the search function only.
[functions."subcontractors-search"]
  included_files = ["subcontractors.json"]
